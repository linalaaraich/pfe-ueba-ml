# ============================================================
# UEBA ML — Configuration centralisée
# Toutes les constantes du projet sont définies ici.
# ============================================================

wazuh:
  alerts_path: /var/ossec/logs/alerts/alerts.json
  session_minutes: 60          # Coupure de session après N min d'inactivité

paths:
  models_dir: models/
  data_dir: data/
  alert_output: /var/log/ueba_alerts.json

behavior:
  sensitive_path: 'C:\Sensitive\'
  work_hour_start: 9
  work_hour_end: 18

detection:
  contamination: 0.01          # Isolation Forest — abaissé 0.05→0.01 : FP normal 10%→2% (audit/DATASET_HEALTH.md)
  ocsvm_nu: 0.01               # One-Class SVM — borne sup. de la fraction d'anomalies
  ocsvm_gamma: 0.01            # One-Class SVM — abaissé 'scale'→0.01 : FP 20%→5% (gamma 'scale' sur-ajustait)
  ae_latent_dim: 4             # Dimension de l'espace latent de l'Autoencoder
  ae_threshold_percentile: 99.0  # Seuil AE = percentile des erreurs de VALIDATION (borne le FP ~1%) — corrige les FP élevés
  ae_threshold_sigma: 3.0      # Repli μ + N×σ si validation trop petite
  ensemble_threshold: 2        # Votes minimum pour déclencher une alerte (sur 3)

daemon:
  poll_seconds: 30             # Intervalle de polling du fichier alerts.json
  history_size: 500            # Sessions historiques conservées pour les z-scores

logging:
  level: INFO                  # DEBUG | INFO | WARNING | ERROR
