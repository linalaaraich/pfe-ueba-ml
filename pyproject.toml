[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ueba-ml"
version = "0.1.0"
description = "Système UEBA Portable — Détection Insider Threat & Malware"
authors = [{name = "Assia", email = "sia.el2020@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ueba", "siem", "wazuh", "anomaly-detection", "machine-learning", "cybersecurity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "tensorflow>=2.16",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "colorama>=0.4",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "notebook>=7.2",
]

[project.scripts]
ueba-export = "ueba.features.parse_logs:main"
ueba-daemon = "ueba.integration.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
